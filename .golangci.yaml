version: "2"

run:
  timeout: 1m
  tests: true

linters:
  default: none
  enable: # please keep this alphabetized
    - asasalint
    - asciicheck
    - copyloopvar
    - dupl
    - errcheck
    - forcetypeassert
    - goconst
    - gocritic
    - govet
    - ineffassign
    - misspell
    - musttag
    - revive
    - staticcheck
    - unused
  exclusions:
    rules:
      # Repeating constants in tests improves test readability.
      - path: _test\.go
        linters:
          - goconst

issues:
  max-issues-per-linter: 0
  max-same-issues: 10
